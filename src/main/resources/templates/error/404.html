<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/baseLayout}">

<head>
    <title th:text="#{refund.header.service-name}">Payments service refunds</title>
</head>
<div layout:fragment="content">

    <div class="govuk-width-container ">
        <main class="govuk-main-wrapper govuk-main-wrapper--auto-spacing" id="main-content" role="main">
            <div class="govuk-grid-row">
                <div class="govuk-grid-column-two-thirds">
                    <h1 id="page-not-found-header" class="govuk-heading-l" th:text="#{refund.error.page-not-found}">Page not found</h1>
                    <p class="govuk-body" th:text="#{refund.error.typed-url}">If you typed the web address, check it is correct.<p>
                    <p class="govuk-body" th:text="#{refund.error.pasted-url}">If you pasted the web address, check you copied the entire address.</p>
                    <p class="govuk-body">
                        <span th:text="#{refund.error.return-to-home}">Return to the</span>
                        <a th:href="${chsUrl}" th:text="#{refund.error.home-link}">Companies House home page.</a>
                    </p>
                    <p></p>
                </div>
            </div>
        </main>
    </div>
</div>
</html>
